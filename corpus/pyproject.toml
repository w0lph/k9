[project]
name = "canine-aging-corpus"
version = "0.1.0"
description = "Reproducible corpus of the canine aging / longevity literature, built from Europe PMC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "typer>=0.12",
]

[project.scripts]
cac = "canine_aging_corpus.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canine_aging_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# typer's idiom is `x: T = typer.Option(...)` in the signature.
"src/canine_aging_corpus/cli.py" = ["B008"]
