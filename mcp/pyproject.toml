[project]
name = "dog-geroscience-mcp"
version = "0.1.1"
description = "MCP server giving agents dog-specific aging tools: HAGR (AnAge/DrugAge/GenAge) dog rows, dog orthologs of aging genes via Ensembl, FDA Km dose translation, Dog Aging Project codebooks, NIH RePORTER grants, and search over the canine aging literature corpus."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "dogs", "aging", "geroscience", "longevity", "veterinary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.urls]
Homepage = "https://github.com/w0lph/k9/tree/main/mcp"
Repository = "https://github.com/w0lph/k9"
Data = "https://huggingface.co/datasets/w0lph/dog-geroscience-mcp-data"

[project.scripts]
dog-geroscience-mcp = "dog_geroscience_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
