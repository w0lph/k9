[project]
name = "canine-trials"
version = "0.1.0"
description = "Canine aging trial registry: typed, quote-grounded records of interventional studies and cohorts in dogs, with a validator."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
ct = "canine_trials.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canine_trials"]
