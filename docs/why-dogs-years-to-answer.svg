<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 254" width="900" height="254" font-family="system-ui, sans-serif" font-size="14">
<title>Years from the first dose to a lifespan answer</title>
<text x="250" y="22" font-size="16" font-weight="600">Years from the first dose to a lifespan answer</text>
<text x="240" y="56" text-anchor="end">Mice (ITP, rapamycin from 600 days)</text>
<rect x="250" y="42" width="23.9" height="22" fill="#9aa0a6" rx="3"/>
<text x="281.9" y="58" fill="#333">last deaths about a year and a half after a start at 600 days</text>
<text x="240" y="102" text-anchor="end">Dogs (from age 8)</text>
<rect x="250" y="88" width="73.8" height="22" fill="#0b57d0" rx="3"/>
<text x="331.8" y="104" fill="#333">4.6 years until half the dogs have died</text>
<text x="240" y="148" text-anchor="end">Rhesus monkeys (calorie restriction)</text>
<rect x="250" y="134" width="318.2" height="22" fill="#9aa0a6" rx="3"/>
<text x="576.2" y="150" fill="#333">20-year longitudinal study</text>
<text x="240" y="194" text-anchor="end">People (from age 65)</text>
<rect x="250" y="180" width="328.3" height="22" fill="#9aa0a6" rx="3"/>
<text x="586.3" y="196" fill="#333">21 years until half the people have died</text>
<text x="250" y="244" font-size="11" fill="#666">Sources: Harrison 2009; Teng 2022 (UK dog life table); Colman 2009; WHO life tables, USA 2019. CC BY 4.0, w0lph.github.io/k9/why-dogs.html</text>
</svg>
